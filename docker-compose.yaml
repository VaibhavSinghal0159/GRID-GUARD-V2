services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridguard-api
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173
      - LOG_LEVEL=INFO
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gridguard-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped