name: GridGuard v2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify production ONNX artifacts
        run: |
          test -f ml/artifacts/gridguard_cnn.onnx
          test -f ml/artifacts/cnn_metrics.json
          test -f ml/artifacts/data_audit.json
          test -f ml/artifacts/demo_sample_50.json

      - name: Run Pytest suite
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/test_api.py -v
