name: GridGuard v2 Full-Stack CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify ONNX artifacts
        run: |
          test -f ml/artifacts/gridguard_cnn.onnx
          test -f ml/artifacts/cnn_metrics.json
          test -f ml/artifacts/data_audit.json
          test -f ml/artifacts/demo_sample_50.json
      - name: Run Pytest suite
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/test_api.py -v

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build